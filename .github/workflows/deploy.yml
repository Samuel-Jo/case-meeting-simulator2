name: Deploy to Cloudflare Workers

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate audio files (Gemini TTS)
        id: generate
        continue-on-error: true
        run: node scripts/generate-audio.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Commit generated audio files (if any)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/audio/lines/ || true
          if git diff --cached --quiet; then
            echo "오디오 파일 변경 없음 — 커밋 건너뜀"
          else
            git commit -m "chore: Gemini TTS 오디오 파일 생성 [skip ci]"
            git push
          fi

      - name: Check all audio files generated
        id: check_audio
        run: |
          if node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('public/audio/lines/manifest.json','utf8'));
            if (m.count !== 22 || m.version !== 'v1') process.exit(1);
          "; then
            echo "audio_ready=true" >> \$GITHUB_OUTPUT
          else
            echo "audio_ready=false" >> \$GITHUB_OUTPUT
            echo "아직 오디오 파일이 완전하지 않습니다. 할당량 리셋 후 재실행하세요."
          fi

      - name: Build with OpenNext
        if: steps.check_audio.outputs.audio_ready == 'true'
        run: npx opennextjs-cloudflare build

      - name: Deploy to Cloudflare Workers
        if: steps.check_audio.outputs.audio_ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          secrets: |
            GEMINI_API_KEY
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
